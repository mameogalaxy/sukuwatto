<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 注: 写真・実在の肖像を模写しない、物理学者を象徴する非写実のオリジナル表現 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#9DBBAC"/>
      <stop offset="100%" stop-color="#34503F"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- スーツの肩 -->
  <path d="M28 200 Q100 150 172 200 Z" fill="#3a4038"/>
  <path d="M86 152 L100 200 114 152 Z" fill="#EDE7DA"/>
  <rect x="96" y="150" width="8" height="22" fill="#5b4a3a"/>
  <!-- 首 -->
  <rect x="89" y="120" width="22" height="28" rx="9" fill="#E8C3A0"/>
  <!-- 顔 -->
  <ellipse cx="100" cy="98" rx="35" ry="40" fill="#F2D3B4"/>
  <!-- もじゃもじゃ白髪 -->
  <path d="M58 96 Q44 84 54 74 Q46 60 60 56 Q58 42 76 44 Q84 32 100 38 Q116 32 124 44 Q142 42 140 56 Q154 60 146 74 Q156 84 142 96 Q138 74 120 70 Q110 64 100 64 Q90 64 80 70 Q62 74 58 96 Z" fill="#ECECEC"/>
  <!-- 眉 -->
  <path d="M78 92 q9 -3 17 1" stroke="#cfcfcf" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M105 93 q9 -4 17 -1" stroke="#cfcfcf" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 目 -->
  <ellipse cx="87" cy="100" rx="4" ry="4.4" fill="#2b211c"/>
  <ellipse cx="113" cy="100" rx="4" ry="4.4" fill="#2b211c"/>
  <!-- 大きな口ひげ -->
  <path d="M82 120 Q100 132 118 120 Q108 124 100 124 Q92 124 82 120 Z" fill="#E2E2E2"/>
  <!-- 口 -->
  <path d="M92 119 q8 4 16 0" stroke="#7a3b34" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
